{% extends "base.html" %}

{% block conteudo %}
<h1>{{ titulo }}</h1>

{% if erro %}<p class="erro">{{ erro }}</p>{% endif %}

<form method="post" action="{{ acao }}">
  <label>Nome
    <input type="text" name="nome" value="{{ valores.nome }}">
  </label>

  <label>Região
    <input type="text" name="regiao" value="{{ valores.regiao }}">
  </label>

  <button type="submit">Salvar</button>
</form>

<p><a href="{{ url_for('bairros.listar') }}">Voltar</a></p>
{% endblock %}
